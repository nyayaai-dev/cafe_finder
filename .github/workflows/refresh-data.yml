name: Monthly data refresh

# Re-downloads every cafe and restaurant from OpenStreetMap on the 1st of each
# month, rebuilds the site, and republishes GitHub Pages. Also runnable by hand
# from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "30 2 1 * *"        # 08:00 IST on the 1st
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download places from OpenStreetMap
        run: python build/fetch_places.py

      - name: Rebuild the site
        run: python build/build.py

      - name: Commit and publish if anything changed
        run: |
          git config user.name "cafe-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places_osm.json site
          if git diff --cached --quiet; then
            echo "No changes this month."
            exit 0
          fi
          git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
          git subtree split --prefix site -b gh-pages-new
          git push origin gh-pages-new:gh-pages
